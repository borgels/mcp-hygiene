name: daily-public-scan

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: Look-back window in hours
        default: '48'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: daily-public-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Scan recent issues, pull requests, comments, reviews and releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          ORG: ${{ github.repository_owner }}
          HOURS: ${{ inputs.hours || '48' }}
        run: node scripts/scan-recent.mjs "$ORG" "$HOURS"
