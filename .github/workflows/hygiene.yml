# Public-text hygiene gate. Intended to run as an organisation ruleset
# required workflow on public repositories; it also runs on this repository.
# The logic lives in scripts/ (pinned below, covered by test/):
# scripts/gate.mjs collects the added lines of the net diff and of every
# commit, changed paths, commit messages, identities, the branch name and the
# pull request title/body, and runs scripts/hygiene-check.mjs on them.
# gitleaks checks the commit range for secrets.
name: public-hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  public-hygiene:
    name: public-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Revision of scripts/ in borgels/mcp-hygiene. Bump after changing scripts/.
      SCANNER_REPO: borgels/mcp-hygiene
      SCANNER_SHA: 23ac3a69f02b0991eb4e5977fc64db9440b4de73
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SCANNER_REPO }}
          ref: ${{ env.SCANNER_SHA }}
          path: .hygiene-tool
          persist-credentials: false

      # Event text (title, body, branch) is read from GITHUB_EVENT_PATH and
      # GITHUB_HEAD_REF inside the script, not passed through env here.
      - name: Collect text to check
        run: node .hygiene-tool/scripts/gate.mjs collect target "$RUNNER_TEMP/hygiene"

      - name: Scan
        if: ${{ !cancelled() && env.BASE_SHA != '' }}
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          # A secret, not a variable: secrets are masked in the public log.
          HYGIENE_ALLOWED_IDENTITIES: ${{ secrets.HYGIENE_ALLOWED_IDENTITIES }}
        run: node .hygiene-tool/scripts/gate.mjs scan "$RUNNER_TEMP/hygiene"

      - name: Install gitleaks
        if: ${{ !cancelled() && env.BASE_SHA != '' }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"; mkdir -p "$dir"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$dir/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  $dir/$tgz" | sha256sum -c -
          tar -xzf "$dir/$tgz" -C "$dir" gitleaks
          # Built-in rules only: --config overrides a .gitleaks.toml from the
          # pull request, and the worktree .gitleaksignore (always read by
          # gitleaks in addition to --gitleaks-ignore-path) is removed before
          # the scan; git mode reads history, not the worktree.
          printf '[extend]\nuseDefault = true\n' > "$dir/config.toml"
          : > "$dir/empty.gitleaksignore"
          rm -f target/.gitleaksignore
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan commit range for secrets
        if: ${{ !cancelled() && env.BASE_SHA != '' }}
        run: |
          set -euo pipefail
          # --text: a .gitattributes "-diff"/"binary" in the change must not hide content
          gitleaks git target \
            --log-opts="--text $BASE_SHA..$HEAD_SHA" \
            --config "$RUNNER_TEMP/gitleaks/config.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks/empty.gitleaksignore" \
            --redact --no-banner --exit-code 1
